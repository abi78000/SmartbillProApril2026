<div class="master-layout">

  <!-- =========================================
       TABLE VIEW
  ========================================== -->

  <ng-container *ngIf="!showForm">

    <div class="master-top-header">

      <!-- LEFT -->

      <div class="master-top-left">

        <div class="master-title-wrapper">

          <h2>

            Branch

          </h2>

        </div>

      </div>


      <!-- RIGHT -->

      <div class="master-top-right">

        <button
          type="button"
          class="master-btn-outline"
          (click)="refresh()"
        >

          Refresh

        </button>


        <button
          type="button"
          class="master-btn-primary"
          (click)="addBranch()"
        >

          + Add Branch

        </button>

      </div>

    </div>


    <!-- TABLE -->

    <div class="master-table-layout">

      <app-dynamic-table

        [data]="branches"

        [columns]="branchColumns"

        (edit)="editBranch($event)"

        (delete)="deleteBranch($event)"

      >

      </app-dynamic-table>

    </div>

  </ng-container>



  <!-- =========================================
       FORM VIEW
  ========================================== -->

  <ng-container *ngIf="showForm">

    <div class="master-form-layout">

      <app-reusable-form

        [title]="formTitle"

        [tabs]="branchTabs"

        [fields]="branchFields"

        [model]="branchModel"

        (saveForm)="saveBranch($event)"

        (cancelForm)="cancelForm()"

      >

      </app-reusable-form>

    </div>

  </ng-container>

</div>
