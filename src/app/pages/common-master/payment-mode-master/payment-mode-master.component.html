<div class="master-layout">

  <!-- =========================================
       TABLE VIEW
  ========================================== -->

  <ng-container *ngIf="!showForm">

    <div class="master-top-header">

      <div class="master-top-left">

        <div class="master-title-wrapper">

          <h2>

            Payment Mode

          </h2>

        </div>

      </div>


      <div class="master-top-right">

        <button
          type="button"
          class="master-btn-outline"
          (click)="refresh()"
        >
          Refresh
        </button>


        <button
          type="button"
          class="master-btn-primary"
          (click)="addPaymentMode()"
        >
          + Add Payment Mode
        </button>

      </div>

    </div>


    <div class="master-table-layout">

      <app-dynamic-table

        [data]="paymentModes"

        [columns]="paymentModeColumns"

        (edit)="editPaymentMode($event)"

        (delete)="deletePaymentMode($event)"

      >

      </app-dynamic-table>

    </div>

  </ng-container>



  <!-- =========================================
       FORM VIEW
  ========================================== -->

  <ng-container *ngIf="showForm">

    <div class="master-form-layout">

      <app-reusable-form

        [title]="formTitle"

        [tabs]="paymentTabs"

        [fields]="paymentFields"

        [model]="paymentModel"

        (saveForm)="savePaymentMode($event)"

        (cancelForm)="cancelForm()"

      >

      </app-reusable-form>

    </div>

  </ng-container>

</div>
