<div class="master-layout">

  <!-- ================= TABLE VIEW ================= -->

  <ng-container *ngIf="!showForm">

    <div class="master-top-header">

      <div class="master-top-left">

        <div class="master-title-wrapper">
          <h2>Service</h2>
        </div>

      </div>

      <div class="master-top-right">

        <button
          type="button"
          class="master-btn-outline"
          (click)="refreshServices()">

          Refresh

        </button>

        <button
          type="button"
          class="master-btn-primary"
          (click)="newService()">

          + Add Service

        </button>

      </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="master-table-layout">

      <app-dynamic-table

        [data]="services"

        [columns]="serviceColumns"

        (edit)="editService($event)"

        (delete)="deleteService($event)">

      </app-dynamic-table>

    </div>

  </ng-container>



  <!-- ================= FORM VIEW ================= -->

  <ng-container *ngIf="showForm">

    <div class="master-form-layout compact-form">

      <app-reusable-form

        [title]="formTitle"

        [tabs]="serviceTabs"

        [fields]="serviceFields"

        [model]="service"

        (fieldChange)="onFieldChange($event)"

        (saveForm)="saveOrUpdateService()"

        (cancelForm)="cancelForm()">

      </app-reusable-form>

    </div>

  </ng-container>

</div>
