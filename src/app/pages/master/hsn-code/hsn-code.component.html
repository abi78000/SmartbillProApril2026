<div class="master-layout">

    <!-- ================= TABLE VIEW ================= -->

    <ng-container *ngIf="!showForm">

        <div class="master-top-header">

            <div class="master-top-left">

                <div class="master-title-wrapper">
                    <h2>HSN Master</h2>
                </div>

            </div>

            <div class="master-top-right">

                <button
                    type="button"
                    class="master-btn-outline"
                    (click)="refreshHSN()">

                    Refresh

                </button>

                <button
                    type="button"
                    class="master-btn-primary"
                    (click)="newHSN()">

                    + Add HSN

                </button>

            </div>

        </div>


        <!-- ================= TABLE ================= -->

        <div class="master-table-layout">

            <app-dynamic-table

                [data]="hsns"

                [columns]="hsnColumns"

                (edit)="editHSN($event)"

                (delete)="deleteHSN($event)">

            </app-dynamic-table>

        </div>

    </ng-container>



    <!-- ================= FORM VIEW ================= -->

    <ng-container *ngIf="showForm">

        <div class="master-form-layout compact-form">

            <app-reusable-form

                [title]="formTitle"

                [tabs]="hsnTabs"

                [fields]="hsnFields"

                [model]="hsn"

                (fieldChange)="onFieldChange($event)"

                (saveForm)="saveOrUpdateHSN()"

                (cancelForm)="cancelForm()">

            </app-reusable-form>

        </div>

    </ng-container>

</div>
