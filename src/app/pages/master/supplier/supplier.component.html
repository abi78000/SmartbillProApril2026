<div class="master-layout">

  <!-- ================= TABLE VIEW ================= -->

  <ng-container *ngIf="!showForm">

    <div class="master-top-header">

      <div class="master-top-left">

        <div class="master-title-wrapper">
          <h2>Supplier Master</h2>
        </div>

      </div>

      <div class="master-top-right">

        <button
          type="button"
          class="master-btn-outline"
          (click)="refreshSuppliers()">

          Refresh

        </button>

        <button
          type="button"
          class="master-btn-primary"
          (click)="newSupplier()">

          + Add Supplier

        </button>

      </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="master-table-layout">

      <app-dynamic-table

        [data]="suppliers"

        [columns]="supplierColumns"

        (edit)="editSupplier($event)"

        (delete)="deleteSupplier($event)">

      </app-dynamic-table>

    </div>

  </ng-container>



  <!-- ================= FORM VIEW ================= -->

  <ng-container *ngIf="showForm">

    <div class="master-form-layout compact-form">

      <app-reusable-form

        [title]="formTitle"

        [tabs]="supplierTabs"

        [fields]="supplierFields"

        [model]="supplier"

        (fieldChange)="onFieldChange($event)"

        (saveForm)="saveOrUpdateSupplier()"

        (cancelForm)="cancelForm()">

      </app-reusable-form>

    </div>

  </ng-container>

</div>
